<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('User Management', ~{::section})}">
<section>
    <h2 class="mb-4"><i class="bi bi-people"></i> User Management</h2>

    <div class="row">
        <div class="col-lg-4 mb-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white"><h5 class="mb-0">Create User</h5></div>
                <div class="card-body">
                    <form th:action="@{/users}" method="post">
                        <input type="hidden" name="action" value="create"/>
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="fullName" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required minlength="6"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select name="role" class="form-select">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create User</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.fullName}">Name</td>
                            <td th:text="${user.username}">user</td>
                            <td th:text="${user.email}">email</td>
                            <td><span class="badge bg-primary" th:text="${user.role}">ROLE</span></td>
                            <td>
                                <span th:if="${user.active}" class="badge bg-success">Active</span>
                                <span th:unless="${user.active}" class="badge bg-secondary">Inactive</span>
                            </td>
                            <td>
                                <form th:action="@{/users}" method="post" class="d-inline">
                                    <input type="hidden" name="action" value="toggle"/>
                                    <input type="hidden" name="id" th:value="${user.id}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-warning">Toggle</button>
                                </form>
                                <form th:action="@{/users}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete user?')">
                                    <input type="hidden" name="action" value="delete"/>
                                    <input type="hidden" name="id" th:value="${user.id}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
