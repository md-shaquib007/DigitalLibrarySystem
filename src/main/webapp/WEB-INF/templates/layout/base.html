<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | Digital Library'">Digital Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-book-half me-2"></i>Digital Library
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-house"></i> Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/books}"><i class="bi bi-bookshelf"></i> All Books</a></li>
                <li class="nav-item" th:if="${isLibrarian}">
                    <a class="nav-link" th:href="@{/catalog}"><i class="bi bi-tags"></i> Manage Catalog</a>
                </li>
                <li class="nav-item" th:if="${isAdmin}">
                    <a class="nav-link" th:href="@{/users}"><i class="bi bi-people"></i> Staff</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="nav-link" th:href="@{/login}"><i class="bi bi-shield-lock"></i> Admin Login</a>
                </li>
                <li class="nav-item dropdown" th:if="${currentUser != null}">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                        <span th:text="${currentUser.fullName}">Admin</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${flashMessage}" class="alert alert-dismissible fade show"
         th:classappend="' alert-' + ${flashType}">
        <span th:text="${flashMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:replace="${content}">Content</div>
</main>

<footer class="bg-light text-center py-3 mt-auto border-top">
    <small class="text-muted">Open Digital Library — Free to browse and download. Learn. Upskill. Grow.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
