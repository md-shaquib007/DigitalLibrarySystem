<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="form(title, action, book)">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h3 th:text="${title}">Book Form</h3>
                    <form th:action="${action}" method="post" enctype="multipart/form-data" class="mt-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold">ISBN (10 or 13 digits)</label>
                            <div class="input-group">
                                <input type="text" id="isbnInput" name="isbn" class="form-control"
                                       placeholder="e.g. 9780134685991"
                                       th:value="${dto != null ? dto.isbn : ''}"/>
                                <button class="btn btn-outline-primary" type="button" id="btnLookupIsbn">
                                    Auto-Fetch Metadata
                                </button>
                            </div>
                            <small class="text-muted" id="isbnStatus">Enter an ISBN and click auto-fetch to automatically populate Title, Edition, Authors, and Description from OpenLibrary / Google Books.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Title *</label>
                            <input type="text" name="title" class="form-control" required
                                   th:value="${dto != null ? dto.title : ''}"/>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Edition</label>
                                <input type="text" name="edition" class="form-control" placeholder="e.g. 2nd Edition"
                                       th:value="${dto != null ? dto.edition : ''}"/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category *</label>
                                <select name="categoryId" class="form-select" required>
                                    <option value="">Select category</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                            th:selected="${dto != null && dto.categoryId == cat.id}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="4"
                                      th:text="${dto != null ? dto.description : ''}"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Publisher</label>
                                <select name="publisherId" class="form-select">
                                    <option value="">Select publisher</option>
                                    <option th:each="pub : ${publishers}" th:value="${pub.id}" th:text="${pub.name}"
                                            th:selected="${dto != null && dto.publisherId == pub.id}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Authors (comma-separated)</label>
                                <input type="text" name="authorNames" class="form-control"
                                       placeholder="e.g. John Doe, Jane Smith"
                                       th:value="${dto != null ? dto.authorNames : ''}"/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tags (comma-separated)</label>
                            <input type="text" name="tags" class="form-control"
                                   placeholder="e.g. MERN, React, Node.js, Full Stack"
                                   th:value="${dto != null ? dto.tags : ''}"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Upload PDF *</label>
                            <input type="file" name="bookFile" class="form-control" accept=".pdf"
                                   th:required="${book == null}"/>
                            <small class="text-muted">Max 50MB. Students download this directly — no login needed.</small>
                            <div th:if="${book != null && book.fileName}" class="mt-1">
                                <small>Current file: <span th:text="${book.fileName}"></span></small>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save Book</button>
                            <a th:href="@{/books}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('btnLookupIsbn');
        const isbnInput = document.getElementById('isbnInput');
        const status = document.getElementById('isbnStatus');
        if (!btn || !isbnInput) return;

        btn.addEventListener('click', function() {
            const isbn = isbnInput.value.trim();
            if (!isbn) {
                alert('Please enter an ISBN number first.');
                return;
            }
            btn.disabled = true;
            status.innerHTML = '<span class="text-primary"><span class="spinner-border spinner-border-sm me-1"></span>Fetching book metadata...</span>';

            fetch('/books/lookup?isbn=' + encodeURIComponent(isbn))
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    btn.disabled = false;
                    if (data && data.title) {
                        const titleInput = document.querySelector('input[name="title"]');
                        if (titleInput) titleInput.value = data.title;
                        const editionInput = document.querySelector('input[name="edition"]');
                        if (editionInput && data.edition) editionInput.value = data.edition;
                        const descInput = document.querySelector('textarea[name="description"]');
                        if (descInput && data.description) descInput.value = data.description;
                        const authorInput = document.querySelector('input[name="authorNames"]');
                        if (authorInput && data.authors) authorInput.value = data.authors;
                        status.innerHTML = '<span class="text-success">Book details fetched successfully!</span>';
                    } else {
                        status.innerHTML = '<span class="text-warning">No metadata found for this ISBN. You can still fill fields manually.</span>';
                    }
                })
                .catch(function(err) {
                    btn.disabled = false;
                    status.innerHTML = '<span class="text-danger">Error fetching metadata. Please fill manually.</span>';
                });
        });
    });
    </script>
</section>
</html>
