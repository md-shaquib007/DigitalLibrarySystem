<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Admin Login', ~{::section})}">
<section>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                        <h3 class="mt-2">Admin Login</h3>
                        <p class="text-muted">Only staff need to login — to add and manage books.<br/>
                            Students can <a th:href="@{/books}">browse and download freely</a>.</p>
                    </div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required
                                   th:value="${username}" placeholder="Admin username"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    <div class="mt-3 p-3 bg-light rounded small">
                        <strong>Demo:</strong> admin / admin123 &nbsp;|&nbsp; librarian / lib123
                    </div>
                    <p class="text-center mt-3 mb-0">
                        <a th:href="@{/dashboard}"><i class="bi bi-arrow-left"></i> Back to library</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
